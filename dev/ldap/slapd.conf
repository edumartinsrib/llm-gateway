# OpenLDAP de desenvolvimento do gateway (NÃO use em produção: senhas em texto puro).
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload memberof

pidfile  /var/run/slapd/slapd.pid
argsfile /var/run/slapd/slapd.args

database mdb
maxsize  104857600
suffix   "dc=exemplo,dc=org"
rootdn   "cn=admin,dc=exemplo,dc=org"
rootpw   admin
directory /var/lib/ldap

# memberOf no usuário, como no Active Directory.
overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint TRUE

index objectClass eq
index uid,cn,member eq

access to attrs=userPassword
    by self write
    by anonymous auth
    by * none
# Como no Active Directory: usuários autenticados leem o diretório (menos senhas).
access to *
    by dn.exact="cn=leitor-gateway,ou=servicos,dc=exemplo,dc=org" read
    by users read
    by * none
