# Ambiente local completo: cada serviço é um projeto com Dockerfile e lê só variáveis de
# ambiente. Postgres, Redis, Vault e OpenLDAP fazem o papel dos recursos da plataforma;
# o fake-foundry imita o Azure AI Foundry (sem custo e sem credencial real).
#
#   docker compose up -d --build
#   uv run python scripts/demo.py        # habilita modelos (preços DE EXEMPLO) e gera tráfego
#
#   console:          http://localhost:8090   ana, diego (usuários) e bruno (admin), senha Senha@123
#   API OpenAI:       http://localhost:8090/v1   (chave criada no console)
#   Swagger da API:   http://localhost:8000/api/v1/docs

x-api-build: &api-build
  context: .
  dockerfile: gateway-api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmgw
      POSTGRES_PASSWORD: llmgw
      POSTGRES_DB: llmgw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Só para o `demo.py --espalhar-dias`; não é usado pelos serviços.
      - "${LLMGW_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgw -d llmgw"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  vault:
    image: hashicorp/vault:2.1
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      retries: 20

  # Grava a credencial do Foundry simulado e a senha da conta de serviço do LDAP.
  vault-init:
    image: hashicorp/vault:2.1
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
    volumes:
      - ./dev/vault/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      vault: {condition: service_healthy}

  ldap:
    build: ./dev/ldap
    image: llmgw-ldap:dev
    # slapd aborta (ch_calloc) com o nofile ilimitado padrão do Docker.
    ulimits:
      nofile: {soft: 1024, hard: 1024}

  fake-foundry:
    build: *api-build
    image: llmgw-api:dev
    command: ["llmgw-fake-foundry"]
    environment:
      FAKE_PORT: "8070"
      FAKE_STREAM_DELAY_MS: "30"
      # Multiplica os tokens informados para o custo da demonstração ter ordem de grandeza real.
      FAKE_USAGE_SCALE: "60"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/healthz')"]
      interval: 5s
      retries: 20

  gateway-api:
    build: *api-build
    image: llmgw-api:dev
    environment:
      LLMGW_DATABASE_URL: postgresql://llmgw:llmgw@postgres:5432/llmgw
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
      LLMGW_AUTH_MODE: ldap
      LLMGW_LDAP_URL: ldap://ldap:389
      LLMGW_LDAP_BIND_DN: cn=leitor-gateway,ou=servicos,dc=exemplo,dc=org
      LLMGW_LDAP_USER_BASE: ou=pessoas,dc=exemplo,dc=org
      LLMGW_LDAP_GROUP_BASE: ou=grupos,dc=exemplo,dc=org
      LLMGW_LDAP_ALLOWED_GROUPS: llm-usuarios
      LLMGW_LDAP_ADMIN_GROUPS: llm-admins
      LLMGW_BOOTSTRAP_PROVIDERS: foundry=llmgw/providers/foundry
      LLMGW_PUBLIC_URL: http://localhost:8090
      LLMGW_DEFAULT_MONTHLY_BUDGET_USD: "50"
      LLMGW_GLOBAL_MONTHLY_BUDGET_USD: "2000"
      # O Foundry simulado responde em HTTP num host interno. Em produção, deixe os padrões
      # (só https e hosts do Azure).
      LLMGW_PROVIDER_ALLOW_HTTP: "true"
      LLMGW_PROVIDER_ALLOWED_HOSTS: fake-foundry,.azure.com,.microsoftonline.com
      # Só no compose: o nginx do console chega por um IP da rede do Docker. Em produção,
      # liste o IP/CIDR do proxy (ver docs/operacao.md).
      LLMGW_FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      vault-init: {condition: service_completed_successfully}
      ldap: {condition: service_healthy}
      fake-foundry: {condition: service_healthy}
    ports:
      - "${LLMGW_API_PORT:-8000}:8000"

  console:
    build: ./gateway-console
    image: llmgw-console:dev
    environment:
      LLMGW_API_UPSTREAM: http://gateway-api:8000
    depends_on: [gateway-api]
    ports:
      - "${LLMGW_CONSOLE_PORT:-8090}:8080"

volumes:
  pgdata:
