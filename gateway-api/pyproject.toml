[project]
name = "gateway-api"
version = "0.1.0"
description = "Gateway LLM: API compatível com OpenAI na frente do Microsoft Foundry, com chaves por usuário, LDAP, cache e controle de custos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "hvac>=2.3",
    "redis>=5.2",
    "httpx>=0.28",
    "ldap3>=2.9.1",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.scripts]
llm-gateway = "llmgw.main:run"
llmgw-fake-foundry = "llmgw.devtools.fake_foundry:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]
